# 薪跳 · iOS 云构建（GitHub Actions 免费 macOS）
name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter 版本
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 关闭 Swift Package Manager（走 CocoaPods）
        run: flutter config --no-enable-swift-package-manager

      - name: 运行引擎测试（13 项）
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: 构建 iOS（无签名）
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log

      - name: 失败时导出完整日志为单条注解（供远程诊断）
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import urllib.parse, os
          name = 'test.log' if os.path.exists('test.log') else 'build.log'
          if os.path.exists(name):
              log = open(name, encoding='utf-8', errors='replace').read()
              tail = '\n'.join(log.splitlines()[-120:])
              print('::error::' + urllib.parse.quote(tail, safe=''))
          PYEOF

      - name: 制作无小组件安装包（免费签名兼容）
        if: success()
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          rm -rf "$APP/PlugIns"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qry ../Runner.ipa Payload

      - name: 上传安装包 Runner.ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ipa
          path: Runner.ipa
          if-no-files-found: error

      - name: 上传 Runner.app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
