# 薪跳 · iOS 云构建（GitHub Actions，免费 macOS 环境）
name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每 2 小时自动重试（GitHub 服务器自行触发，无需本地电脑）
    - cron: '17 */2 * * *'

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        slot: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter 版本
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 关闭 Swift Package Manager（走 CocoaPods）
        run: flutter config --no-enable-swift-package-manager

      - name: 运行引擎测试（13 项）
        run: flutter test

      - name: 构建 iOS（无签名）
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log

      - name: 失败时导出完整日志为单条注解（供远程诊断）
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import urllib.parse
          log = open('build.log', encoding='utf-8', errors='replace').read()
          tail = '\n'.join(log.splitlines()[-100:])
          print('::error::' + urllib.parse.quote(tail, safe=''))
          PYEOF

      - name: 制作无小组件安装包（免费签名兼容）
        if: success()
        run: |
          set -e
          APP=build/ios/iphoneos/Runner.app
          rm -rf "$APP/PlugIns"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qry ../Runner.ipa Payload

      - name: 上传安装包 Runner.ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-ipa-${{ matrix.os }}-${{ matrix.slot }}
          path: Runner.ipa
          if-no-files-found: error

      - name: 上传 Runner.app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app-${{ matrix.os }}-${{ matrix.slot }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
