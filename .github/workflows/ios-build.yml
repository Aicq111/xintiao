# 薪跳 · iOS 云构建（GitHub Actions，免费 macOS 环境）
name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter 版本
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 运行引擎测试（13 项）
        run: flutter test

      - name: 构建 iOS（无签名）
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log

      - name: 失败时导出日志为注解（供远程诊断）
        if: failure()
        run: |
          echo "===== build.log 尾部 ====="
          tail -n 120 build.log
          tail -n 80 build.log | sed 's/^/::error::/'

      - name: 上传 Runner.app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
